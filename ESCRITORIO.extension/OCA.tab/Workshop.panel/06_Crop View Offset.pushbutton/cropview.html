<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop View Offset</title>
<style>
  :root{
    --bg:#070C16; --panel:rgba(255,255,255,.028); --line:rgba(101,227,255,.22);
    --grid:rgba(101,227,255,.05); --ink:#D9E8F5; --dim:#7A8FA9;
    --cy:#65E3FF; --teal:#3DDCB4; --amber:#FFB454; --mag:#FF4F9A; --violet:#9D8CFF;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 48px),
      radial-gradient(1200px 600px at 15% -10%, #0D1B33 0%, var(--bg) 55%);
    color:var(--ink); font-family:"Bahnschrift","Segoe UI",system-ui,sans-serif;
    padding:36px clamp(16px,4vw,56px) 80px; min-height:100vh;
  }
  .mono{font-family:Consolas,"Cascadia Mono",monospace}
  header{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:28px}
  .eyebrow{font-size:11px; letter-spacing:.45em; color:var(--cy); text-transform:uppercase}
  h1{font-size:clamp(22px,3vw,36px); font-weight:600; letter-spacing:.04em; margin-top:6px}
  h1 span{color:var(--dim); font-weight:300}
  .stamp{text-align:right; font-size:11px; color:var(--dim); letter-spacing:.12em; line-height:1.8}
  .stamp b{color:var(--teal); font-weight:600}
  h2{font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:var(--dim);
    margin:0 0 16px; display:flex; align-items:center; gap:12px}
  h2::after{content:""; flex:1; height:1px; background:var(--line)}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:36px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:18px 16px 14px; position:relative; overflow:hidden}
  .card::before{content:""; position:absolute; top:0; left:0; width:100%; height:2px;
    background:linear-gradient(90deg, var(--c,var(--cy)), transparent 70%)}
  .card .v{font-size:28px; font-weight:600; color:var(--c,var(--cy)); font-variant-numeric:tabular-nums;
    overflow-wrap:anywhere}
  .card .v.txt{font-size:17px; line-height:1.3}
  .card .v small{font-size:14px; color:var(--dim); font-weight:400}
  .card .l{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim); margin-top:8px}

  .views{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr)); gap:18px; margin-bottom:36px}
  .vcard{background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden;
    display:flex; flex-direction:column}
  .vcard.warn{border-color:rgba(255,180,84,.45)}
  .vcard.error{border-color:rgba(255,79,154,.5)}
  .vhead{padding:14px 16px 10px; border-bottom:1px solid var(--line)}
  .vhead .t{font-size:15px; font-weight:600; letter-spacing:.02em; overflow-wrap:anywhere}
  .vhead .s{font-size:11px; color:var(--dim); letter-spacing:.12em; margin-top:4px; text-transform:uppercase}
  .badge{display:inline-block; padding:2px 8px; border-radius:2px; font-size:10px; letter-spacing:.15em;
    text-transform:uppercase; border:1px solid var(--line); color:var(--teal); margin-right:6px}
  .badge.warn{color:var(--amber); border-color:rgba(255,180,84,.45)}
  .badge.error{color:var(--mag); border-color:rgba(255,79,154,.5)}
  svg.plot{display:block; width:100%; height:260px; background:rgba(0,0,0,.18)}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; padding:12px 16px 16px; font-size:12px}
  .kv dt{color:var(--dim); letter-spacing:.08em}
  .kv dd{color:var(--ink); font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
  .msg{margin:0 16px 14px; padding:8px 10px; font-size:12px; border-radius:3px;
    background:rgba(255,180,84,.08); border:1px solid rgba(255,180,84,.35); color:var(--amber)}
  .vcard.error .msg{background:rgba(255,79,154,.08); border-color:rgba(255,79,154,.4); color:var(--mag)}
  .legend{display:flex; gap:18px; flex-wrap:wrap; font-size:11px; color:var(--dim); letter-spacing:.08em; margin:-6px 0 16px}
  .legend i{display:inline-block; width:18px; height:0; border-top:2px solid; vertical-align:middle; margin-right:6px}

  ul.warns{list-style:none; display:flex; flex-direction:column; gap:8px}
  ul.warns li{font-size:12px; padding:8px 12px; border-left:2px solid var(--amber);
    background:rgba(255,180,84,.05); color:var(--ink)}
  .empty{text-align:center; padding:30px 0; color:var(--teal); letter-spacing:.2em; font-size:12px}

  footer{margin-top:60px; font-size:10px; letter-spacing:.3em; color:var(--dim);
    text-transform:uppercase; text-align:center}
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">Crop View // Offset</div>
    <h1 id="proj"></h1>
  </div>
  <div class="stamp mono">GERADO <b id="stamp"></b><br>ORIGEM <b>REVIT · PYREVIT</b></div>
</header>

<div class="cards" id="cards"></div>

<h2>Vistas</h2>
<div class="legend">
  <span><i style="border-color:var(--cy)"></i>Elemento</span>
  <span><i style="border-color:var(--dim); border-top-style:dashed"></i>Limite do elemento (orientado)</span>
  <span><i style="border-color:var(--amber)"></i>Recorte aplicado (com margem)</span>
</div>
<div class="views" id="views"></div>

<h2>Avisos</h2>
<div id="warns"></div>

<footer>Crop View Offset · gerado localmente · nenhum dado sai desta máquina</footer>

<script>
const DATA = __DATA__;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const num = (n,d) => Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});

document.getElementById("proj").innerHTML =
  esc(DATA.project.replace(/\.rvt$/i,"")) + ' <span>/ ' + esc(DATA.activeView) + '</span>';
document.getElementById("stamp").textContent = DATA.generated;

const results = DATA.results || [];
const nOk = results.filter(r => r.status === "ok").length;
const nWarn = results.filter(r => r.status === "warn").length;
const nErr = results.filter(r => r.status === "error").length;

document.getElementById("cards").innerHTML = [
  {v: esc(DATA.mode), l: "Ação", c: "var(--cy)", txt: true},
  {v: num(DATA.margin, 2) + ' <small>m</small>', l: "Margem", c: "var(--amber)"},
  {v: nOk + nWarn, l: "Vista ajustada", c: "var(--teal)"},
  {v: nErr, l: "Falhas", c: nErr ? "var(--mag)" : "var(--dim)"},
  {v: (DATA.warnings || []).length, l: "Avisos", c: (DATA.warnings||[]).length ? "var(--amber)" : "var(--dim)"},
].map(k => `<div class="card" style="--c:${k.c}"><div class="v${k.txt ? " txt" : ""}">${k.v}</div><div class="l">${k.l}</div></div>`).join("");

/* Desenho: coordenadas em metros no sistema da vista (u → direita, v ↑ cima). */
function plot(r){
  const pts = r.crop.concat(r.tight);
  r.segs.forEach(s => { pts.push([s[0],s[1]]); pts.push([s[2],s[3]]); });
  if(!pts.length) return "";
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max(x1-x0, y1-y0, 0.1) * 0.08;
  const vb = [x0-pad, -(y1+pad), (x1-x0)+2*pad, (y1-y0)+2*pad].join(" ");
  const poly = a => a.map(p => p[0] + "," + (-p[1])).join(" ");
  const segs = r.segs.map(s => `M${s[0]},${-s[1]}L${s[2]},${-s[3]}`).join("");
  return `<svg class="plot" viewBox="${vb}" preserveAspectRatio="xMidYMid meet">
    <polygon points="${poly(r.crop)}" fill="rgba(255,180,84,.07)" stroke="#FFB454" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <polygon points="${poly(r.tight)}" fill="none" stroke="#7A8FA9" stroke-width="1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>
    <path d="${segs}" fill="none" stroke="#65E3FF" stroke-width="1" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

const STATUS = {ok:"OK", warn:"Aviso", error:"Falha"};
document.getElementById("views").innerHTML = results.length ? results.map(r => {
  const rows = r.status === "error" ? [
      ["Elementos", r.elements.map(esc).join("<br>")],
    ] : [
      ["Elementos", r.elements.map(esc).join("<br>")],
      ["Title on Sheet (EN)", r.titleEn ? esc(r.titleEn) : "—"],
      ["Recorte", num(r.width,2) + " × " + num(r.height,2) + " m"],
      ["Inclinação", num(r.angle,2) + "° em relação à vista"],
      ["Método", esc(r.method)],
      ["Orientação por", esc(r.source)],
      ["Id da vista", r.viewId],
    ];
  return `<div class="vcard ${r.status}">
    <div class="vhead">
      <div class="t">${esc(r.view)}</div>
      <div class="s"><span class="badge ${r.status}">${STATUS[r.status]}</span>${esc(r.action)}${r.viewType ? " · " + esc(r.viewType) : ""}</div>
    </div>
    ${plot(r)}
    <dl class="kv">${rows.map(k => `<dt>${k[0]}</dt><dd>${k[1]}</dd>`).join("")}</dl>
    ${r.msg ? `<div class="msg">${esc(r.msg)}</div>` : ""}
  </div>`;
}).join("") : '<div class="empty">NENHUMA VISTA PROCESSADA</div>';

const warns = DATA.warnings || [];
document.getElementById("warns").innerHTML = warns.length
  ? '<ul class="warns">' + warns.map(w => `<li>${esc(w)}</li>`).join("") + "</ul>"
  : '<div class="empty">SEM AVISOS</div>';
</script>
</body>
</html>
