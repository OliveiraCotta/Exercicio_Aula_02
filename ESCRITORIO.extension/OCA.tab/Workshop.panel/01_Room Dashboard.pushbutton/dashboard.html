<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room Dashboard</title>
<style>
  :root{
    --bg:#070C16; --panel:rgba(255,255,255,.028); --line:rgba(101,227,255,.22);
    --grid:rgba(101,227,255,.05); --ink:#D9E8F5; --dim:#7A8FA9;
    --cy:#65E3FF; --teal:#3DDCB4; --amber:#FFB454; --mag:#FF4F9A; --violet:#9D8CFF;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:
      linear-gradient(rgba(7,12,22,.0), rgba(7,12,22,.0)),
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 48px),
      radial-gradient(1200px 600px at 15% -10%, #0D1B33 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:"Bahnschrift","Segoe UI",system-ui,sans-serif;
    padding:36px clamp(16px,4vw,56px) 80px;
    min-height:100vh;
  }
  .mono{font-family:Consolas,"Cascadia Mono",monospace}

  /* header */
  header{display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:28px}
  .eyebrow{font-size:11px; letter-spacing:.45em; color:var(--cy); text-transform:uppercase}
  h1{font-size:clamp(24px,3.4vw,40px); font-weight:600; letter-spacing:.04em; margin-top:6px}
  h1 span{color:var(--dim); font-weight:300}
  .stamp{text-align:right; font-size:11px; color:var(--dim); letter-spacing:.12em; line-height:1.8}
  .stamp b{color:var(--teal); font-weight:600}

  h2{font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:var(--dim);
    margin:0 0 16px; display:flex; align-items:center; gap:12px}
  h2::after{content:""; flex:1; height:1px; background:var(--line)}
  h2 select{background:rgba(101,227,255,.06); color:var(--cy); border:1px solid var(--line);
    border-radius:3px; font-family:inherit; font-size:11px; letter-spacing:.2em;
    text-transform:uppercase; padding:3px 8px; cursor:pointer; outline:none}
  h2 select:focus{border-color:var(--cy)}

  /* metric cards */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:40px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:18px 16px 14px; position:relative; overflow:hidden}
  .card::before{content:""; position:absolute; top:0; left:0; width:100%; height:2px;
    background:linear-gradient(90deg, var(--c,var(--cy)), transparent 70%)}
  .card .v{font-size:32px; font-weight:600; color:var(--c,var(--cy)); font-variant-numeric:tabular-nums}
  .card .v small{font-size:14px; color:var(--dim); font-weight:400}
  .card .l{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim); margin-top:8px}

  .grid2{display:grid; grid-template-columns:1.4fr 1fr; gap:40px; margin-bottom:48px; align-items:start}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  /* section panel: fixed viewport height, scrolls when there are many levels */
  .panelbody{height:520px; display:flex; flex-direction:column}
  .sectionscroll{flex:1; overflow-y:auto; overflow-x:hidden;
    border:1px solid rgba(101,227,255,.08); border-radius:6px; padding:4px;
    scrollbar-width:thin; scrollbar-color:rgba(101,227,255,.35) transparent}
  /* themed scrollbar (WebKit / Chromium / WebView2) */
  .sectionscroll::-webkit-scrollbar{width:8px}
  .sectionscroll::-webkit-scrollbar-track{background:transparent; margin:4px 0}
  .sectionscroll::-webkit-scrollbar-thumb{
    background:linear-gradient(var(--cy),var(--violet)); border-radius:8px;
    border:2px solid transparent; background-clip:padding-box}
  .sectionscroll::-webkit-scrollbar-thumb:hover{
    background:linear-gradient(var(--cy),var(--mag)); background-clip:padding-box}
  #section{display:block; max-width:100%}
  /* donut sits in a fixed square, centered; legend below scrolls if needed */
  .donutbox{display:flex; align-items:center; justify-content:center; height:230px; flex:none}
  #donut{width:230px; height:230px; flex:none}
  .legend{margin-top:14px; overflow-y:auto; flex:1}

  /* section + donut svg */
  svg text{font-family:"Bahnschrift","Segoe UI",sans-serif}
  .floor{cursor:default}
  .floor rect.seg{transition:filter .15s}
  .floor:hover rect.seg{filter:brightness(1.25)}

  /* table */
  .searchrow{display:flex; gap:12px; margin-bottom:14px}
  input[type=text]{flex:1; background:rgba(101,227,255,.04); border:1px solid var(--line);
    border-radius:3px; color:var(--cy); padding:10px 14px; font-size:13px;
    letter-spacing:.14em; font-family:inherit; outline:none}
  input[type=text]::placeholder{color:var(--dim)}
  input[type=text]:focus{border-color:var(--cy); box-shadow:0 0 0 1px rgba(101,227,255,.25)}
  .count{align-self:center; font-size:11px; color:var(--dim); letter-spacing:.15em; white-space:nowrap}
  /* per-column filter inputs in the schedule header */
  #filterrow th{padding:4px 8px 10px; border-bottom:1px solid var(--line)}
  .colfilter{width:100%; box-sizing:border-box; background:rgba(101,227,255,.04);
    border:1px solid var(--line); border-radius:3px; color:var(--cy); padding:5px 7px;
    font-size:11px; font-family:inherit; letter-spacing:.05em; outline:none}
  .colfilter:focus{border-color:var(--cy)}
  .colfilter::placeholder{color:var(--dim); text-transform:none; letter-spacing:0}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th{font-size:10px; letter-spacing:.25em; text-transform:uppercase; color:var(--cy);
    text-align:left; padding:10px 12px; border-bottom:1px solid var(--line);
    cursor:pointer; user-select:none; white-space:nowrap}
  th .dir{color:var(--amber)}
  td{padding:8px 12px; border-bottom:1px solid rgba(255,255,255,.05); color:var(--ink)}
  td.num{font-variant-numeric:tabular-nums; text-align:right}
  tr:hover td{background:rgba(101,227,255,.05)}
  .tag{display:inline-block; padding:2px 8px; border:1px solid var(--line);
    border-radius:2px; font-size:11px; color:var(--dim)}

  /* donut legend (HTML, so long names never crop) */
  .legend{display:flex; flex-direction:column; gap:9px}
  .legrow{display:flex; align-items:center; gap:10px; font-size:12px; min-width:0}
  .legrow .sw{width:11px; height:11px; border-radius:2px; flex:none}
  .legrow .nm{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .legrow .vl{margin-left:auto; color:var(--dim); font-family:Consolas,monospace;
    font-size:10px; white-space:nowrap; flex:none; padding-left:8px}

  /* brief comparison */
  .btn{background:rgba(101,227,255,.06); border:1px solid var(--line); border-radius:3px;
    color:var(--cy); font-family:inherit; font-size:11px; letter-spacing:.15em;
    text-transform:uppercase; padding:9px 14px; cursor:pointer; outline:none; display:inline-block}
  .btn:hover{border-color:var(--cy); background:rgba(101,227,255,.12)}
  .briefbar{display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap}
  .briefmsg{font-size:11px; color:var(--dim); letter-spacing:.1em}
  .hint{color:var(--dim); font-size:13px; line-height:1.7; max-width:640px}
  .hint b{color:var(--ink)}
  .cmp{width:100%; border-collapse:collapse; font-size:13px}
  .cmp th{font-size:10px; letter-spacing:.25em; text-transform:uppercase; color:var(--cy);
    text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
  .cmp td{padding:8px 12px; border-bottom:1px solid rgba(255,255,255,.05); color:var(--ink)}
  .cmp td.num{font-variant-numeric:tabular-nums; text-align:right; font-family:Consolas,monospace}
  .cmp tr.tot td{border-top:1px solid var(--line); font-weight:600; color:var(--ink)}
  .cmp .bars{min-width:150px; width:26%}
  .bar{height:7px; border-radius:2px; margin:3px 0; min-width:1px}
  .bar.actual{background:var(--cy)}
  .bar.actual.within{background:var(--teal)}   /* actual within ±10% of brief */
  .bar.actual.off{background:var(--mag)}        /* actual >10% over or under */
  .bar.brief{background:transparent; border:1px solid var(--dim)}
  .within{color:var(--teal)} .off{color:var(--mag)} .flat{color:var(--dim)}
  .over{color:var(--mag)} .under{color:var(--teal)}
  /* department toggle checkboxes */
  .cmp td.pick{width:34px; text-align:center}
  .cmp input[type=checkbox]{accent-color:var(--cy); cursor:pointer}
  .cmp tr.off-row td:not(.pick){opacity:.35}
  .cmp th.sortable{cursor:pointer; user-select:none}
  .cmp th .dir{color:var(--amber)}

  .warnbox{margin-top:48px; border:1px dashed rgba(255,79,154,.5); border-radius:4px;
    padding:18px 20px; background:rgba(255,79,154,.04)}
  .warnbox h2{color:var(--mag)} .warnbox h2::after{background:rgba(255,79,154,.4)}
  .warnbox li{list-style:none; padding:4px 0; font-size:13px; color:var(--dim)}
  .warnbox li b{color:var(--ink); font-weight:600}

  footer{margin-top:60px; font-size:10px; letter-spacing:.3em; color:var(--dim);
    text-transform:uppercase; text-align:center}

  @media (prefers-reduced-motion: no-preference){
    .card,.grid2 > div, header{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
    .card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
    .card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}
    @keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1}}
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">Room Analytics // Digital Section</div>
    <h1 id="proj"></h1>
  </div>
  <div class="stamp mono">
    GENERATED <b id="stamp"></b><br>SOURCE <b>REVIT · PYREVIT</b>
  </div>
</header>

<div class="cards" id="cards"></div>

<div class="grid2">
  <div>
    <h2>Building Section - Area by <select id="sectiongroupby"></select></h2>
    <div class="panelbody"><div class="sectionscroll"><svg id="section"></svg></div></div>
  </div>
  <div>
    <h2>Area by <select id="groupby"></select></h2>
    <div class="panelbody">
      <div class="donutbox"><svg id="donut" viewBox="0 0 220 220"></svg></div>
      <div id="donutlegend" class="legend"></div>
    </div>
  </div>
</div>

<h2>Brief Comparison - by <span id="briefLevel"></span></h2>
<div class="briefbar">
  <button id="briefExport" class="btn">&#x2913; Export brief template (.xlsx)</button>
  <label class="btn" for="briefImport">&#x2911; Import filled brief (.xlsx / .csv)</label>
  <input id="briefImport" type="file" accept=".xlsx,.csv,text/csv" style="display:none">
  <span id="briefMsg" class="briefmsg"></span>
</div>
<div id="briefWrap"></div>

<h2>Room Schedule</h2>
<div class="searchrow">
  <span class="hint" style="font-size:12px">Filter each column below ↓</span>
  <div class="count mono" id="rowcount" style="margin-left:auto"></div>
</div>
<table id="tbl">
  <thead><tr id="headrow"></tr><tr id="filterrow"></tr></thead>
  <tbody id="rows"></tbody>
</table>

<div class="warnbox" id="warn" style="display:none">
  <h2>Unplaced / Redundant Rooms</h2>
  <ul id="warnlist"></ul>
</div>

<footer>Room Dashboard · generated locally · no data leaves this machine</footer>

<script>
const DATA = __DATA__;
const PAL = ["#65E3FF","#3DDCB4","#9D8CFF","#FFB454","#FF4F9A","#7AC1FF","#B7F26D","#FF8E6E"];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt = n => n.toLocaleString(undefined,{maximumFractionDigits:0});
const esc = s => String(s).replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("proj").innerHTML =
  DATA.project.replace(/\.rvt$/i,"") + " <span>/ rooms</span>";
document.getElementById("stamp").textContent = DATA.generated;

/* ---------- aggregate ---------- */
const rooms = DATA.rooms;
const MAP = DATA.mapping || {cat1:"",cat2:"",cat3:""};
/* the category levels the user actually mapped, in order */
const CATS = [
  {key:"cat1", label:MAP.cat1},
  {key:"cat2", label:MAP.cat2},
  {key:"cat3", label:MAP.cat3},
].filter(c => c.label);
/* what the donut can group by - fall back to Level if no category was mapped */
const GROUPS = CATS.length ? CATS.slice() : [{key:"level", label:"Level"}];

const byLevel = {};
rooms.forEach(r=>{
  (byLevel[r.level] = byLevel[r.level] || {area:0,count:0});
  byLevel[r.level].area += r.area; byLevel[r.level].count++;
});
function groupArea(key){
  const g = {};
  rooms.forEach(r=>{ const k = (r[key] && r[key].length) ? r[key] : "Undefined";
                     g[k] = (g[k]||0) + r.area; });
  return g;
}
const total = rooms.reduce((s,r)=>s+r.area,0);

/* Stable colour map: a category value always gets the same colour across the
   donut, the section bars, and the legend. Cached per group key. Ordered by
   total area (largest first) so the biggest categories get the leading palette. */
const _colorMaps = {};
function colorMap(key){
  if(_colorMaps[key]) return _colorMaps[key];
  const g = groupArea(key);
  const names = Object.keys(g).sort((a,b)=>g[b]-g[a]);
  const map = {};
  names.forEach((n,i)=>{ map[n] = PAL[i%PAL.length]; });
  _colorMaps[key] = map;
  return map;
}
function catColor(key, name){
  const m = colorMap(key);
  return m[name] || m["Undefined"] || PAL[0];
}

/* ---------- metric cards with count-up ---------- */
const metrics = [
  {v:rooms.length, l:"Placed rooms", c:"var(--cy)"},
  {v:total, l:"Total area", c:"var(--teal)", unit:" m²"},
  {v:rooms.length?total/rooms.length:0, l:"Avg room area", c:"var(--violet)", unit:" m²", dec:1},
  {v:Object.keys(byLevel).length, l:"Levels", c:"var(--amber)"},
  {v:DATA.unplaced.length, l:"Unplaced", c: DATA.unplaced.length?"var(--mag)":"var(--dim)"}
];
const cards = document.getElementById("cards");
metrics.forEach(m=>{
  const d = document.createElement("div");
  d.className = "card"; d.style.setProperty("--c", m.c);
  d.innerHTML = `<div class="v"><span>0</span><small>${m.unit||""}</small></div><div class="l">${m.l}</div>`;
  cards.appendChild(d);
  const span = d.querySelector("span"), t0 = performance.now(), dur = 900;
  const show = x => span.textContent = m.dec ? x.toFixed(m.dec) : fmt(Math.round(x));
  if(reduce){ show(m.v); return; }
  (function tick(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    show(m.v*e);
    if(p<1) requestAnimationFrame(tick);
  })(t0);
});

/* ---------- signature: building section (stacked by category) ---------- */
// per-floor, per-category area: byLevelCat[levelName][catValue] = area
function levelCatBreakdown(key){
  const m = {};
  rooms.forEach(r=>{
    const lv = r.level;
    const cat = (key==="level") ? lv : ((r[key] && r[key].length) ? r[key] : "Undefined");
    (m[lv] = m[lv] || {});
    m[lv][cat] = (m[lv][cat] || 0) + r.area;
  });
  return m;
}

const sectionSvg = document.getElementById("section");
function drawSection(groupKey){
  const order = DATA.levels.filter(l=>byLevel[l.name]).reverse(); // top floor first
  const extra = Object.keys(byLevel).filter(n=>!DATA.levels.some(l=>l.name===n));
  extra.forEach(n=>order.push({name:n, elevation:null}));
  const many = order.length > 14;
  const rowH = many ? 30 : 44;
  const pad = {t:10,b:26,l:150,r:120};
  const H = pad.t + pad.b + order.length*rowH;
  const W = 640;
  sectionSvg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  sectionSvg.setAttribute("width", W);
  sectionSvg.setAttribute("height", H);

  const breakdown = levelCatBreakdown(groupKey);
  const maxA = Math.max(...order.map(l=>byLevel[l.name].area));
  const scale = a => (a/maxA)*(W-pad.l-pad.r);
  const byLevelIsFlat = (groupKey === "level");

  let s = `<line x1="${pad.l-8}" y1="${pad.t}" x2="${pad.l-8}" y2="${H-pad.b}"
             stroke="var(--line)" stroke-width="1"/>`;
  order.forEach((l,i)=>{
    const d = byLevel[l.name], y = pad.t + i*rowH;
    const barH = Math.max(8, rowH-14);
    const rowTotal = d.area, fullW = scale(rowTotal);

    // segments for this floor, ordered by the global colour-map order (largest cats first)
    const cats = breakdown[l.name] || {};
    const cmap = colorMap(groupKey);
    const orderedCats = Object.keys(cmap).filter(c => cats[c] > 0);
    // any category not in the map (shouldn't happen) appended
    Object.keys(cats).forEach(c=>{ if(!orderedCats.includes(c)) orderedCats.push(c); });

    let segs = "", xoff = 0;
    orderedCats.forEach((cat, si)=>{
      const segW = scale(cats[cat]);
      const col = byLevelIsFlat ? PAL[i%PAL.length] : catColor(groupKey, cat);
      segs += `<rect class="seg" x="${pad.l+xoff}" y="${y+(rowH-barH)/2}"
                 width="${reduce?segW:0}" height="${barH}"
                 fill="${col}${byLevelIsFlat?"33":"cc"}"
                 stroke="var(--bg)" stroke-width="${byLevelIsFlat?0:0.5}">
                 <title>${esc(l.name)} · ${esc(cat)}: ${fmt(cats[cat])} m²</title>
        ${reduce?"":`<animate attributeName="width" from="0" to="${segW}" dur="0.6s"
             begin="${Math.min(0.05*i,1.2)}s" fill="freeze" calcMode="spline"
             keySplines="0.2 0.7 0.2 1" keyTimes="0;1" values="0;${segW}"/>`}
      </rect>`;
      xoff += segW;
    });
    // flat-level view keeps a border outline for the classic plate look
    if(byLevelIsFlat){
      const col = PAL[i%PAL.length];
      segs += `<rect x="${pad.l}" y="${y+(rowH-barH)/2}" width="${fullW}" height="${barH}"
                 rx="1.5" fill="none" stroke="${col}" stroke-width="1.2"/>`;
    }

    s += `<g class="floor">
      <text x="${pad.l-16}" y="${y+rowH/2+(many?3:4)}" text-anchor="end"
            font-size="${many?10:12}" fill="var(--ink)" letter-spacing="1">${esc(l.name)}</text>
      ${(!many && l.elevation!==null)?`<text x="${pad.l-16}" y="${y+rowH/2+18}" text-anchor="end"
            font-size="9" fill="var(--dim)">+${l.elevation.toFixed(2)} m</text>`:""}
      ${segs}
      <text x="${pad.l+fullW+10}" y="${y+rowH/2+(many?3:4)}" font-size="${many?9:11}"
            fill="var(--dim)" font-family="Consolas,monospace">${fmt(rowTotal)} m²${many?"":" · "+d.count+" rm"}</text>
    </g>`;
  });
  s += `<line x1="${pad.l-40}" y1="${H-pad.b+8}" x2="${W-pad.r+60}" y2="${H-pad.b+8}"
          stroke="var(--dim)" stroke-width="1.5"/>
        <text x="${pad.l-40}" y="${H-6}" font-size="9" fill="var(--dim)"
          letter-spacing="3">GROUND DATUM</text>`;
  sectionSvg.innerHTML = s;
}

/* section group-by: Level (flat) + each mapped category */
(function(){
  const sel = document.getElementById("sectiongroupby");
  const opts = [{key:"level", label:"Level"}, ...CATS];
  sel.innerHTML = opts.map(o=>`<option value="${o.key}">${o.label}</option>`).join("");
  // default to the first category if one is mapped (that's the interesting view),
  // otherwise Level
  const initial = CATS.length ? CATS[0].key : "level";
  sel.value = initial;
  sel.onchange = ()=>drawSection(sel.value);
  if(opts.length < 2) sel.disabled = true;
  drawSection(initial);
})();

/* ---------- donut: area by selected category level ---------- */
const donutSvg = document.getElementById("donut");
const donutLegend = document.getElementById("donutlegend");

// point on a circle for a given fraction (0..1), 0 = top, clockwise
function polar(cx, cy, r, frac){
  const a = frac * 2 * Math.PI - Math.PI/2;   // start at 12 o'clock
  return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
}
// SVG arc path for a ring segment between two fractions
function ringArc(cx, cy, rOuter, rInner, f0, f1){
  const large = (f1 - f0) > 0.5 ? 1 : 0;
  const [ox0, oy0] = polar(cx, cy, rOuter, f0);
  const [ox1, oy1] = polar(cx, cy, rOuter, f1);
  const [ix1, iy1] = polar(cx, cy, rInner, f1);
  const [ix0, iy0] = polar(cx, cy, rInner, f0);
  return `M ${ox0.toFixed(2)} ${oy0.toFixed(2)} `
       + `A ${rOuter} ${rOuter} 0 ${large} 1 ${ox1.toFixed(2)} ${oy1.toFixed(2)} `
       + `L ${ix1.toFixed(2)} ${iy1.toFixed(2)} `
       + `A ${rInner} ${rInner} 0 ${large} 0 ${ix0.toFixed(2)} ${iy0.toFixed(2)} Z`;
}

function drawDonut(groupKey){
  const byGroup = groupArea(groupKey);
  const entries = Object.entries(byGroup).sort((a,b)=>b[1]-a[1]);
  const cx=110, cy=110, rOuter=100, rInner=72;
  let acc=0, s="";
  entries.forEach(([name,val],i)=>{
    const frac = total ? val/total : 0, col = catColor(groupKey, name);
    if(frac <= 0) return;
    const f0 = acc, f1 = acc + frac;
    // tiny gap between segments for definition
    const gap = Math.min(0.004, frac/4);
    const d = ringArc(cx, cy, rOuter, rInner, f0+gap, f1-gap);
    s += `<path d="${d}" fill="${col}" stroke="var(--bg)" stroke-width="0.5">
      ${reduce?"":`<animate attributeName="opacity" from="0" to="1" dur="0.4s"
        begin="${0.08*i}s" fill="freeze"/>`}</path>`;
    acc = f1;
  });
  s += `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="30" fill="var(--ink)"
          font-weight="600">${fmt(total)}</text>
        <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="10" fill="var(--dim)"
          letter-spacing="2">TOTAL m²</text>`;
  donutSvg.innerHTML = s;

  donutLegend.innerHTML = entries.map(([name,val],i)=>{
    const col = catColor(groupKey, name), pct = total ? (100*val/total).toFixed(1) : "0";
    return `<div class="legrow">
      <span class="sw" style="background:${col}"></span>
      <span class="nm" title="${esc(name)}">${esc(name)}</span>
      <span class="vl">${fmt(val)} m² · ${pct}%</span>
    </div>`;
  }).join("");
}

/* build the group-by dropdown from the mapped levels */

/* ---------- brief comparison (actual vs target area) ---------- */
const roomBrief = {};   // shared: { roomId: briefArea } - used by comparison AND schedule
(function(){
  const levelKey = GROUPS[0].key, levelLabel = GROUPS[0].label;
  document.getElementById("briefLevel").textContent = levelLabel;

  // per-room brief target values (m²), keyed by room id
  let seededFromRevit = false;
  if(rooms.some(r => +r.brief > 0)){          // brief area came from a Revit parameter
    rooms.forEach(r=>{ if(+r.brief > 0) roomBrief[r.id] = +r.brief; });
    seededFromRevit = true;
  }
  // aggregate per-room briefs up to the current group level for the comparison
  function briefByGroup(){
    const g = {};
    rooms.forEach(r=>{
      const v = roomBrief[r.id];
      if(v == null) return;
      const k = (r[levelKey] && r[levelKey].length) ? r[levelKey] : "Undefined";
      g[k] = (g[k]||0) + v;
    });
    return g;
  }

  const wrap = document.getElementById("briefWrap");
  const msg  = document.getElementById("briefMsg");

  /* ----- CSV helpers ----- */
  function csvCell(s){ s = String(s); return /[;",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
  function download(name, text){
    const blob = new Blob(["\uFEFF"+text], {type:"text/csv;charset=utf-8;"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  }

  /* ----- minimal .xlsx writer (no external library, works offline) -----
     An .xlsx is a ZIP of XML parts. We build the few required parts and
     pack them with a store-only (uncompressed) ZIP + CRC32. Cells are typed:
     numbers export as real numbers, everything else as inline strings.      */
  const CRC_TABLE = (()=>{
    const t = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n;
      for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
      t[n]=c>>>0;
    }
    return t;
  })();
  function crc32(bytes){
    let c = 0xFFFFFFFF;
    for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  const enc = s => new TextEncoder().encode(s);
  function xmlEsc(s){ return String(s).replace(/[<>&"']/g, m =>
    ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&apos;"}[m])); }
  function colRef(i){ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26|0; } return s; }

  function sheetXml(rowsArr){
    // rowsArr: array of arrays; each cell is {v:value, n:isNumber}
    let body = "";
    rowsArr.forEach((row, r)=>{
      let cells = "";
      row.forEach((cell, c)=>{
        const ref = colRef(c) + (r+1);
        if(cell == null || cell.v === "" || cell.v == null){ return; }
        const numeric = cell.n && typeof cell.v === "number" && isFinite(cell.v);
        if(numeric){
          cells += `<c r="${ref}"><v>${cell.v}</v></c>`;
        }else{
          cells += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(cell.v)}</t></is></c>`;
        }
      });
      body += `<row r="${r+1}">${cells}</row>`;
    });
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
  }

  function buildXlsx(sheetName, rowsArr){
    const parts = [
      ["[Content_Types].xml",
       `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`],
      ["_rels/.rels",
       `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ["xl/workbook.xml",
       `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(sheetName).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
      ["xl/_rels/workbook.xml.rels",
       `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`],
      ["xl/worksheets/sheet1.xml", sheetXml(rowsArr)],
    ];

    // Assemble a store-only ZIP
    const chunks = [], central = [];
    let offset = 0;
    const u16 = n => [n&0xFF, (n>>8)&0xFF];
    const u32 = n => [n&0xFF, (n>>8)&0xFF, (n>>16)&0xFF, (n>>24)&0xFF];
    parts.forEach(([name, content])=>{
      const nameB = enc(name), dataB = enc(content), crc = crc32(dataB);
      const local = [].concat(
        u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(dataB.length), u32(dataB.length),
        u16(nameB.length), u16(0));
      chunks.push(new Uint8Array(local), nameB, dataB);
      central.push({nameB, crc, size:dataB.length, offset});
      offset += local.length + nameB.length + dataB.length;
    });
    const cdStart = offset;
    const cd = [];
    central.forEach(e=>{
      const rec = [].concat(
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(e.crc), u32(e.size), u32(e.size),
        u16(e.nameB.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(e.offset));
      cd.push(new Uint8Array(rec), e.nameB);
    });
    const cdBytes = cd.reduce((a,b)=>a+b.length, 0);
    const end = new Uint8Array([].concat(
      u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length),
      u32(cdBytes), u32(cdStart), u16(0)));
    return new Blob([...chunks, ...cd, end],
      {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  }

  function downloadBlob(name, blob){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  }
  function detectDelim(line){
    const c = {";":0, ",":0, "\t":0}; let inq=false;
    for(const ch of line){ if(ch==='"') inq=!inq; else if(!inq && c[ch]!=null) c[ch]++; }
    return Object.keys(c).reduce((a,b)=>c[b]>c[a]?b:a, ";");
  }
  function splitLine(line, d){
    const out=[]; let cur="", inq=false;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(inq){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inq=false; } else cur+=ch; }
      else { if(ch==='"') inq=true; else if(ch===d){ out.push(cur); cur=""; } else cur+=ch; }
    }
    out.push(cur); return out.map(x=>x.trim());
  }
  function parseNum(s, d){
    if(s==null) return NaN; s=String(s).trim(); if(!s) return NaN;
    if(d===";") s = s.replace(/\s/g,"").replace(/\./g,"").replace(",", ".");  // EU: . thousands, , decimal
    else        s = s.replace(/\s/g,"").replace(/,/g,"");                      // US: , thousands
    const n = parseFloat(s); return isNaN(n) ? NaN : n;
  }

  /* ----- export template: one row per room, empty Brief_m2 to fill (.xlsx) ----- */
  document.getElementById("briefExport").onclick = ()=>{
    const headers = ["RoomID","Number","Name","Level", ...CATS.map(c=>c.label), "Actual_m2","Brief_m2"];
    const rowsArr = [ headers.map(h=>({v:h, n:false})) ];
    // stable order: by level, then number
    const ordered = rooms.slice().sort((a,b)=>
      String(a.level).localeCompare(String(b.level),undefined,{numeric:true}) ||
      String(a.number).localeCompare(String(b.number),undefined,{numeric:true}));
    ordered.forEach(r=>{
      const bv = roomBrief[r.id]!=null ? Math.round(roomBrief[r.id]) : "";
      const row = [
        {v:r.id, n:true},
        {v:r.number, n:false},
        {v:r.name, n:false},
        {v:r.level, n:false},
        ...CATS.map(c=>({v:r[c.key]||"", n:false})),
        {v:Math.round(r.area), n:true},
        {v:bv, n:bv!==""},          // empty brief stays blank, editable in Excel
      ];
      rowsArr.push(row);
    });
    const proj = (DATA.project||"project").replace(/\.rvt$/i,"");
    const blob = buildXlsx("Room Brief", rowsArr);
    downloadBlob(proj + "_room_brief.xlsx", blob);
    msg.textContent = rooms.length + " rooms exported to Excel - fill Brief_m2 per room, then import.";
  };

  /* ----- shared: apply a table (array of row-arrays) to roomBrief ----- */
  function applyBriefRows(rows){
    if(!rows || rows.length < 2) throw new Error("no data rows");
    const header = rows[0].map(h=>String(h||"").toLowerCase());
    const idCol    = header.findIndex(h=>/roomid|room id|elementid|^id$/.test(h));
    const numCol   = header.findIndex(h=>/number|nummer|no\.?$/.test(h));
    const lvlCol   = header.findIndex(h=>/level|niveau|etage|geschoss/.test(h));
    let briefCol   = header.findIndex(h=>/brief|target|program|programme|soll|ziel/.test(h));
    if(briefCol < 0) briefCol = header.length - 1;
    const byNumLvl = {};
    rooms.forEach(r=>{ byNumLvl[(r.number+"|"+r.level).toLowerCase()] = r.id; });
    let n = 0;
    for(let i=1;i<rows.length;i++){
      const r = rows[i]; if(!r) continue;
      const raw = r[briefCol];
      const val = (typeof raw === "number") ? raw : parseNum(raw, ";");
      if(isNaN(val)) continue;
      let id = null;
      if(idCol >= 0 && r[idCol] != null && r[idCol] !== ""){
        const p = parseInt(r[idCol],10); if(!isNaN(p)) id = p;
      }
      if(id == null && numCol >= 0 && lvlCol >= 0)
        id = byNumLvl[((r[numCol]||"")+"|"+(r[lvlCol]||"")).toLowerCase()];
      if(id != null){ roomBrief[id] = val; n++; }
    }
    seededFromRevit = false;
    msg.textContent = n + " room brief value(s) loaded.";
    renderBrief();
    if(window.refreshSchedule) window.refreshSchedule();  // update Brief column below
  }

  function csvToRows(text){
    text = String(text).replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n").trim();
    const lines = text.split("\n").filter(l=>l.length);
    const D = detectDelim(lines[0]);
    return lines.map(l=>splitLine(l, D));
  }

  /* ----- read .xlsx (unzip + parse sheet1) using native browser APIs ----- */
  async function inflateRaw(bytes){
    // stored (uncompressed) entries have method 0 and are returned as-is by caller;
    // this handles method 8 (raw deflate) via DecompressionStream.
    const ds = new DecompressionStream("deflate-raw");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }
  async function unzip(bytes){
    // minimal central-directory ZIP reader → {name: Uint8Array}
    const dv = new DataView(bytes.buffer);
    const files = {};
    // find End Of Central Directory
    let eocd = bytes.length - 22;
    while(eocd >= 0 && dv.getUint32(eocd, true) !== 0x06054b50) eocd--;
    if(eocd < 0) throw new Error("not a zip/xlsx");
    let cd = dv.getUint32(eocd + 16, true);
    const count = dv.getUint16(eocd + 10, true);
    const td = new TextDecoder();
    for(let i=0;i<count;i++){
      if(dv.getUint32(cd, true) !== 0x02014b50) break;
      const method = dv.getUint16(cd + 10, true);
      const compSize = dv.getUint32(cd + 20, true);
      const nameLen = dv.getUint16(cd + 28, true);
      const extraLen = dv.getUint16(cd + 30, true);
      const cmtLen = dv.getUint16(cd + 32, true);
      const lho = dv.getUint32(cd + 42, true);
      const name = td.decode(bytes.subarray(cd + 46, cd + 46 + nameLen));
      // local header: recompute data offset
      const lNameLen = dv.getUint16(lho + 26, true);
      const lExtraLen = dv.getUint16(lho + 28, true);
      const dataStart = lho + 30 + lNameLen + lExtraLen;
      const comp = bytes.subarray(dataStart, dataStart + compSize);
      files[name] = { method, comp };
      cd += 46 + nameLen + extraLen + cmtLen;
    }
    async function get(name){
      const f = files[name]; if(!f) return null;
      return f.method === 0 ? f.comp : await inflateRaw(f.comp);
    }
    return { names:Object.keys(files), get };
  }
  async function xlsxToRows(arrbuf){
    const zip = await unzip(new Uint8Array(arrbuf));
    const td = new TextDecoder();
    // shared strings (if any)
    let shared = [];
    const ssBytes = await zip.get("xl/sharedStrings.xml");
    if(ssBytes){
      const xml = td.decode(ssBytes);
      shared = Array.from(xml.matchAll(/<si>([\s\S]*?)<\/si>/g)).map(m=>{
        const texts = Array.from(m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)).map(t=>t[1]);
        return unescapeXml(texts.join(""));
      });
    }
    // first worksheet
    let sheetName = zip.names.find(n=>/^xl\/worksheets\/sheet1\.xml$/i.test(n))
                 || zip.names.find(n=>/^xl\/worksheets\/.*\.xml$/i.test(n));
    const sheetXmlText = td.decode(await zip.get(sheetName));
    const rowMatches = Array.from(sheetXmlText.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g));
    const rows = [];
    rowMatches.forEach(rm=>{
      const cells = Array.from(rm[1].matchAll(/<c\b([^>]*)>([\s\S]*?)<\/c>|<c\b([^>]*)\/>/g));
      const rowArr = [];
      cells.forEach(cm=>{
        const attrs = cm[1] || cm[3] || "";
        const inner = cm[2] || "";
        const ref = (attrs.match(/r="([A-Z]+)\d+"/)||[])[1];
        const col = ref ? colIndex(ref) : rowArr.length;
        const type = (attrs.match(/t="([^"]+)"/)||[])[1];
        let val = "";
        if(type === "inlineStr"){
          const t = inner.match(/<t[^>]*>([\s\S]*?)<\/t>/); val = t ? unescapeXml(t[1]) : "";
        }else{
          const v = inner.match(/<v>([\s\S]*?)<\/v>/); const raw = v ? v[1] : "";
          if(type === "s"){ val = shared[parseInt(raw,10)] || ""; }
          else if(raw !== "" && !isNaN(+raw)){ val = +raw; }
          else { val = unescapeXml(raw); }
        }
        rowArr[col] = val;
      });
      rows.push(rowArr);
    });
    return rows;
  }
  function colIndex(ref){ let i=0; for(const ch of ref) i = i*26 + (ch.charCodeAt(0)-64); return i-1; }
  function unescapeXml(s){ return String(s)
    .replace(/&#x([0-9a-fA-F]+);/g, (_,h)=>String.fromCodePoint(parseInt(h,16)))
    .replace(/&#(\d+);/g, (_,d)=>String.fromCodePoint(parseInt(d,10)))
    .replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&"); }

  /* ----- import filled brief: accepts .xlsx or .csv ----- */
  document.getElementById("briefImport").addEventListener("change", ev=>{
    const f = ev.target.files[0]; if(!f) return;
    const isXlsx = /\.xlsx$/i.test(f.name);
    const rd = new FileReader();
    rd.onload = async ()=>{
      try{
        const rows = isXlsx ? await xlsxToRows(rd.result) : csvToRows(rd.result);
        applyBriefRows(rows);
      }catch(err){ msg.textContent = "Could not read that file (" + err.message + ")."; }
      ev.target.value = "";
    };
    if(isXlsx) rd.readAsArrayBuffer(f); else rd.readAsText(f, "utf-8");
  });

  /* ----- render comparison ----- */
  // sort + exclusion state for the comparison table
  let cmpSortK = "actual", cmpDir = -1;   // default: actual desc
  const excluded = {};                     // { catName: true } if unticked

  function renderBrief(){
    const actual = groupArea(levelKey);
    const brief = briefByGroup();
    const haveBrief = Object.keys(brief).length > 0;
    if(!haveBrief){
      wrap.innerHTML = `<p class="hint">No brief loaded yet. Click <b>Export brief template</b> to get
        an Excel file with <b>every room</b> and an empty <b>Brief_m2</b> column. Fill one brief area per
        room, save, then <b>Import filled brief</b> to see actual‑vs‑target variance aggregated by
        ${esc(levelLabel.toLowerCase())}. Rooms are matched by <b>RoomID</b>, so keep that column intact.</p>`;
      return;
    }
    let cats = Array.from(new Set(Object.keys(actual).concat(Object.keys(brief))));

    // build a row record per category
    const recs = cats.map(c=>{
      const a = actual[c]||0, b = brief[c]||0;
      const d = a - b, pct = b ? (100*d/b) : null;
      // within ±10% of brief = green; more than 10% off (either way) = red
      const within = (b>0 && Math.abs(d)/b <= 0.10);
      const state = (b<=0) ? "flat" : (within ? "within" : "off");
      return {c, a, b, d, pct, state};
    });

    // sort
    const dir = cmpDir;
    recs.sort((x,y)=>{
      let vx, vy;
      switch(cmpSortK){
        case "cat":    return String(x.c).localeCompare(String(y.c),undefined,{numeric:true})*dir;
        case "brief":  vx=x.b; vy=y.b; break;
        case "actual": vx=x.a; vy=y.a; break;
        case "delta":  vx=x.d; vy=y.d; break;
        case "pct":    vx=(x.pct==null?-Infinity:x.pct); vy=(y.pct==null?-Infinity:y.pct); break;
        default:       vx=x.a; vy=y.a;
      }
      return (vx-vy)*dir;
    });

    // totals only over included rows
    const maxV = Math.max(1, ...recs.map(r=>Math.max(r.a, r.b)));
    let tA=0, tB=0;
    const body = recs.map(r=>{
      const off = !!excluded[r.c];
      if(!off){ tA+=r.a; tB+=r.b; }
      const aW = 100*r.a/maxV, bW = 100*r.b/maxV;
      const barCls = r.state==="within" ? "within" : (r.state==="off" ? "off" : "");
      const bars = `<div class="bar actual ${barCls}" style="width:${aW.toFixed(1)}%"></div>
                    <div class="bar brief" style="width:${bW.toFixed(1)}%"></div>`;
      return `<tr class="${off?"off-row":""}">
        <td class="pick"><input type="checkbox" data-cat="${esc(r.c)}" ${off?"":"checked"}></td>
        <td>${esc(r.c)}</td>
        <td class="num">${r.b?fmt(r.b):"-"}</td>
        <td class="num">${fmt(r.a)}</td>
        <td class="bars">${bars}</td>
        <td class="num ${r.state}">${r.d>0?"+":""}${fmt(r.d)}</td>
        <td class="num ${r.state}">${r.pct==null?"-":(r.d>0?"+":"")+r.pct.toFixed(1)+"%"}</td>
      </tr>`;
    }).join("");

    const tD = tA - tB, tPct = tB ? (100*tD/tB) : null;
    const tWithin = (tB>0 && Math.abs(tD)/tB <= 0.10);
    const tState = (tB<=0) ? "flat" : (tWithin ? "within" : "off");

    // sortable header cells
    const H = (key,label,extra="")=>{
      const arrow = (cmpSortK===key) ? ` <span class="dir">${cmpDir>0?"▲":"▼"}</span>` : "";
      return `<th class="sortable ${extra}" data-sort="${key}">${label}${arrow}</th>`;
    };

    wrap.innerHTML = `
      ${seededFromRevit ? `<p class="hint" style="margin-bottom:14px">Brief seeded per room from Revit
        parameter <b>${esc(MAP.briefParam||"")}</b>. Importing a file overrides matching rooms.</p>` : ""}
      <table class="cmp">
        <thead><tr>
          <th class="pick"></th>
          ${H("cat", esc(levelLabel))}
          ${H("brief","Brief m²")}
          ${H("actual","Actual m²")}
          <th>Actual ▸ Brief</th>
          ${H("delta","Δ m²")}
          ${H("pct","Δ %")}
        </tr></thead>
        <tbody>${body}
          <tr class="tot"><td class="pick"></td><td>TOTAL</td><td class="num">${fmt(tB)}</td>
            <td class="num">${fmt(tA)}</td><td></td>
            <td class="num ${tState}">${tD>0?"+":""}${fmt(tD)}</td>
            <td class="num ${tState}">${tPct==null?"-":(tD>0?"+":"")+tPct.toFixed(1)+"%"}</td></tr>
        </tbody>
      </table>`;

    // wire header sorting
    wrap.querySelectorAll("th.sortable").forEach(th=>{
      th.onclick = ()=>{
        const k = th.dataset.sort;
        cmpDir = (cmpSortK===k) ? -cmpDir : (k==="cat" ? 1 : -1);
        cmpSortK = k;
        renderBrief();
      };
    });
    // wire department toggles
    wrap.querySelectorAll('input[type=checkbox][data-cat]').forEach(cb=>{
      cb.onchange = ()=>{
        const cat = cb.getAttribute("data-cat");
        if(cb.checked) delete excluded[cat]; else excluded[cat] = true;
        renderBrief();   // re-render to update totals + dimming
      };
    });
  }

  if(seededFromRevit) msg.textContent = "Brief loaded from Revit parameter.";
  renderBrief();
})();

/* ---------- table: per-column filter + sort ---------- */
const COLS = [
  {k:"number", l:"Number"}, {k:"name", l:"Name"},
  {k:"level", l:"Level"},
  ...CATS.map(c=>({k:c.key, l:c.label})),   // one column per mapped level
  {k:"area", l:"Area (m²)", num:true},
  {k:"brief", l:"Brief (m²)", num:true, brief:true},   // per-room brief target
];
let sortK = "level", sortDir = 1;
const filters = {};   // { colKey: lowercased filter text }

const headrow = document.getElementById("headrow");
const filterrow = document.getElementById("filterrow");
COLS.forEach(c=>{
  const th = document.createElement("th");
  th.onclick = ()=>{ sortDir = (sortK===c.k)? -sortDir : 1; sortK=c.k; render(); };
  th.dataset.k = c.k; headrow.appendChild(th);

  const fth = document.createElement("th");
  const inp = document.createElement("input");
  inp.type = "text"; inp.className = "colfilter";
  inp.placeholder = c.num ? "≥ min…" : "filter…";
  inp.oninput = e=>{ filters[c.k] = e.target.value.trim().toLowerCase(); render(); };
  fth.appendChild(inp); filterrow.appendChild(fth);
});

// brief value for a room (may be undefined)
function roomBriefVal(r){ return roomBrief[r.id]; }

function render(){
  headrow.querySelectorAll("th").forEach((th,i)=>{
    const c = COLS[i];
    th.innerHTML = c.l + (sortK===c.k ? ` <span class="dir">${sortDir>0?"▲":"▼"}</span>` : "");
  });
  let list = rooms.filter(r=>{
    return COLS.every(c=>{
      const f = filters[c.k];
      if(!f) return true;
      if(c.brief){
        const bv = roomBriefVal(r);
        const min = parseFloat(f.replace(",","."));
        return isNaN(min) ? true : (bv!=null && bv >= min);
      }
      if(c.num){
        const min = parseFloat(f.replace(",","."));
        return isNaN(min) ? true : ((r[c.k]||0) >= min);
      }
      return String(r[c.k]||"").toLowerCase().includes(f);
    });
  });
  list.sort((a,b)=>{
    let x, y;
    if(sortK==="brief"){ x = roomBriefVal(a); y = roomBriefVal(b);
      x = (x==null?-Infinity:x); y = (y==null?-Infinity:y); }
    else { x = a[sortK]; y = b[sortK]; }
    return (typeof x==="number" ? x-y : String(x).localeCompare(String(y),undefined,{numeric:true}))*sortDir;
  });
  document.getElementById("rows").innerHTML = list.map(r=>{
    const cells = COLS.map(c=>{
      if(c.k==="number") return `<td class="mono">${esc(r.number)}</td>`;
      if(c.k==="level")  return `<td><span class="tag">${esc(r.level)}</span></td>`;
      if(c.brief){ const bv = roomBriefVal(r);
        return `<td class="num mono">${bv!=null?fmt(bv):"-"}</td>`; }
      if(c.num)          return `<td class="num mono">${r.area.toFixed(2)}</td>`;
      return `<td>${esc(r[c.k]) || "-"}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;
  }).join("");
  document.getElementById("rowcount").textContent =
    list.length + " / " + rooms.length + " ROOMS";
}
window.refreshSchedule = render;   // let the brief import refresh this table
render();

/* ---------- unplaced ---------- */
if(DATA.unplaced.length){
  document.getElementById("warn").style.display = "block";
  document.getElementById("warnlist").innerHTML = DATA.unplaced.map(u=>
    `<li><b>${u.number||"-"}</b> ${u.name||"(unnamed)"} · ${u.level}</li>`).join("");
}
</script>
</body>
</html>
