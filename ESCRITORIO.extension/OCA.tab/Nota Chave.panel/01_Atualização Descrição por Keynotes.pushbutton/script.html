<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keynotes × Excel</title>
<style>
  :root{
    --bg:#070C16; --panel:rgba(255,255,255,.028); --line:rgba(101,227,255,.22);
    --grid:rgba(101,227,255,.05); --ink:#D9E8F5; --dim:#7A8FA9;
    --cy:#65E3FF; --teal:#3DDCB4; --amber:#FFB454; --mag:#FF4F9A; --violet:#9D8CFF;
    --green:#50D682; --red:#E84A4A;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 48px),
      radial-gradient(1200px 600px at 15% -10%, #0D1B33 0%, var(--bg) 55%);
    color:var(--ink); font-family:"Bahnschrift","Segoe UI",system-ui,sans-serif;
    padding:36px clamp(16px,4vw,56px) 80px; min-height:100vh;
  }
  .mono{font-family:Consolas,"Cascadia Mono",monospace}
  header{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:28px}
  .eyebrow{font-size:11px; letter-spacing:.45em; color:var(--cy); text-transform:uppercase}
  h1{font-size:clamp(22px,3vw,36px); font-weight:600; letter-spacing:.04em; margin-top:6px}
  h1 span{color:var(--dim); font-weight:300}
  .stamp{text-align:right; font-size:11px; color:var(--dim); letter-spacing:.12em; line-height:1.8}
  .stamp b{color:var(--teal); font-weight:600}
  .tbadge{display:inline-block; margin-top:6px; padding:3px 12px; border:1px solid var(--cy);
    border-radius:20px; color:var(--cy); font-size:12px; letter-spacing:.18em}
  h2{font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:var(--dim);
    margin:0 0 16px; display:flex; align-items:center; gap:12px}
  h2::after{content:""; flex:1; height:1px; background:var(--line)}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:16px 16px 12px; position:relative; overflow:hidden}
  .card::before{content:""; position:absolute; top:0; left:0; width:100%; height:2px;
    background:linear-gradient(90deg, var(--c,var(--cy)), transparent 70%)}
  .card .v{font-size:30px; font-weight:600; color:var(--c,var(--cy)); font-variant-numeric:tabular-nums}
  .card .l{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-top:8px; line-height:1.5}
  button.card{cursor:pointer; text-align:left; font:inherit; color:inherit}
  button.card:hover{border-color:var(--c,var(--cy))}
  button.card.on{background:rgba(101,227,255,.07); border-color:var(--c,var(--cy))}
  button.card.zero{opacity:.45}
  .card .h{font-size:11px; color:var(--dim); margin-top:6px; letter-spacing:.02em; line-height:1.4}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:18px 22px; margin-bottom:30px}
  .panel p{font-size:13px; line-height:1.7; color:var(--ink)}
  .panel .path{color:var(--teal); font-family:Consolas,monospace; word-break:break-all}
  .panel .warn{color:var(--amber)}

  .toolbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px}
  .toolbar input{flex:1; min-width:220px; background:rgba(255,255,255,.04); border:1px solid var(--line);
    color:var(--ink); padding:9px 12px; border-radius:4px; font:inherit; font-size:13px}
  .toolbar input:focus{outline:none; border-color:var(--cy)}
  .btn{background:transparent; border:1px solid var(--line); color:var(--cy); padding:8px 14px;
    border-radius:4px; font:inherit; font-size:11px; letter-spacing:.2em; text-transform:uppercase; cursor:pointer}
  .btn:hover{border-color:var(--cy); background:rgba(101,227,255,.06)}
  .filterinfo{font-size:11px; color:var(--dim); letter-spacing:.12em}

  details.cat{background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:12px}
  details.cat > summary{cursor:pointer; list-style:none; padding:14px 20px; display:flex; align-items:center; gap:14px}
  details.cat > summary::-webkit-details-marker{display:none}
  details.cat > summary::before{content:"▸"; color:var(--cy); transition:transform .15s}
  details.cat[open] > summary::before{transform:rotate(90deg)}
  .cn{font-size:15px; font-weight:600; letter-spacing:.03em}
  .cc{margin-left:auto; font-size:11px; color:var(--dim); letter-spacing:.14em; font-family:Consolas,monospace}
  .cc b{color:var(--amber)}
  .tw{overflow-x:auto; padding:0 6px 6px}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--cy);
    text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:bottom}
  td{padding:9px 12px; border-bottom:1px solid rgba(255,255,255,.05); color:var(--ink); vertical-align:top}
  td.num{font-variant-numeric:tabular-nums; text-align:right}
  tr:hover td{background:rgba(101,227,255,.04)}
  .key{font-family:Consolas,monospace; font-size:14px; color:var(--cy); white-space:nowrap}
  .sub{display:block; font-size:11px; color:var(--dim); margin-top:3px; line-height:1.45}
  .none{color:var(--dim); font-style:italic}
  .val{display:block; line-height:1.45}
  .val + .val{margin-top:4px; padding-top:4px; border-top:1px dashed rgba(255,255,255,.08)}
  .diffv{color:var(--mag)}
  .flag{display:inline-block; margin:2px 4px 2px 0; padding:2px 8px; border-radius:2px; font-size:11px;
    border:1px solid var(--fc); color:var(--fc); background:rgba(255,255,255,.03); white-space:nowrap}
  .ok{color:var(--teal); font-size:11px; letter-spacing:.14em}
  .holder{display:block; font-size:12px; line-height:1.5}
  .holder .id{font-family:Consolas,monospace; color:var(--dim); font-size:11px}
  .holder .kd{display:inline-block; font-size:9px; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid var(--line); color:var(--dim); padding:0 5px; border-radius:2px; margin-right:4px}
  .empty{text-align:center; padding:44px 0; color:var(--teal); letter-spacing:.2em}
  footer{margin-top:60px; font-size:10px; letter-spacing:.3em; color:var(--dim);
    text-transform:uppercase; text-align:center; line-height:2}
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">Keynotes · Revit × Excel</div>
    <h1 id="proj"></h1>
    <span class="tbadge" id="tbadge"></span>
  </div>
  <div class="stamp mono">GERADO <b id="stamp"></b><br>ESCOPO <b id="scope"></b><br>PLANILHA <b id="xlname"></b></div>
</header>

<div class="cards" id="totals"></div>

<h2>Operação</h2>
<div class="panel" id="actions"></div>

<h2>Inconsistências <span style="flex:0; letter-spacing:.1em; text-transform:none; white-space:nowrap">(clique para filtrar)</span></h2>
<div class="cards" id="issueCards"></div>

<h2>Keynotes por categoria</h2>
<div class="toolbar">
  <input id="q" type="search" placeholder="Buscar keynote, descrição, tipo ou material...">
  <button class="btn" id="expand">Expandir tudo</button>
  <button class="btn" id="collapse">Recolher tudo</button>
  <button class="btn" id="csv">Exportar CSV</button>
  <span class="filterinfo" id="finfo"></span>
</div>
<div id="cats"></div>

<div id="changesWrap"></div>

<footer>Atualização Descrição por Keynotes · Description (PT) e <span id="inparam"></span> em parâmetros de tipo / material<br>
O Excel é a base revisada das descrições · Excel → Modelo nunca apaga valores</footer>

<script>
const DATA = __DATA__;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt = n => Number(n).toLocaleString("pt-BR");
const ISSUE = {}; DATA.issues.forEach(i=>ISSUE[i.code]=i);
let activeFlag = null;
// pendência = keynote USADO no modelo com alguma inconsistência (linhas do
// template ainda não usadas não contam)
const pending = k => k.inModel && k.flags.some(f=>f!=="excel_only");

document.getElementById("proj").innerHTML =
  esc(DATA.project.replace(/\.rvt$/i,"")) + ' <span>/ keynotes × excel</span>';
document.getElementById("tbadge").textContent = DATA.modeLabel.toUpperCase();
document.getElementById("stamp").textContent = DATA.generated;
document.getElementById("scope").textContent = DATA.scope + (DATA.materials ? " + materiais" : "");
document.getElementById("xlname").textContent = DATA.excel.name + " › " + DATA.excel.sheet;
document.getElementById("inparam").textContent = DATA.inParam;

/* ---- totais ---- */
(function(){
  const s = DATA.summary;
  const flagged = DATA.keynotes.filter(pending).length;
  const cards = [
    {v:s.model, l:"Keynotes no modelo", c:"var(--cy)"},
    {v:s.holders, l:"Tipos / materiais com keynote", c:"var(--cy)"},
    {v:s.excel, l:"Keynotes no Excel", c:"var(--teal)"},
    {v:s.both, l:"Em ambos", c:"var(--green)"},
    {v:flagged, l:"Keynotes do modelo com pendência", c: flagged ? "var(--amber)" : "var(--teal)"},
  ];
  document.getElementById("totals").innerHTML = cards.map(m=>
    `<div class="card" style="--c:${m.c}"><div class="v">${fmt(m.v)}</div><div class="l">${esc(m.l)}</div></div>`).join("");
})();

/* ---- painel da operação ---- */
(function(){
  const el = document.getElementById("actions");
  const ch = DATA.changes, sk = DATA.skipped;
  const xl = ch.filter(c=>c.target==="excel"), md = ch.filter(c=>c.target==="model");
  let html = "";
  if(DATA.mode==="analyze"){
    html += `<p>Somente análise - <b>nada foi gravado</b> no modelo nem na planilha.</p>`;
  } else if(DATA.mode==="to_excel"){
    const ap = xl.filter(c=>c.action==="append").length, fi = xl.filter(c=>c.action==="fill").length;
    html += xl.length
      ? `<p><b>Modelo → Excel:</b> ${ap} keynote(s) adicionado(s) ao fim da aba <b>${esc(DATA.excel.sheet)}</b> e ${fi} descrição(ões) vazia(s) preenchida(s). Descrições já existentes no Excel não foram alteradas.</p>`
      : `<p><b>Modelo → Excel:</b> nenhuma alteração gravada.</p>`;
    if(DATA.excel.backup) html += `<p>Backup: <span class="path">${esc(DATA.excel.backup)}</span></p>`;
  } else {
    const ow = md.filter(c=>c.action==="overwrite").length, fi = md.filter(c=>c.action==="fill").length;
    html += md.length
      ? `<p><b>Excel → Modelo:</b> ${ow} valor(es) sobrescrito(s) e ${fi} preenchido(s) nos parâmetros de tipo / material. Desfaça com Ctrl+Z se necessário.</p>`
      : `<p><b>Excel → Modelo:</b> nenhuma alteração gravada.</p>`;
  }
  if(sk.length) html += `<p class="warn">${sk.length} item(ns) não gravado(s) - veja a tabela no fim da página.</p>`;
  if(DATA.missingIn.length){
    html += `<p class="warn">Parâmetro <b>${esc(DATA.inParam)}</b> não encontrado em: ${
      DATA.missingIn.map(m=>esc(m.category)+" ("+m.count+")").join(", ")
    }. Vincule o parâmetro compartilhado a essas categorias (e a Materiais) como parâmetro de tipo.</p>`;
  }
  html += `<p style="color:var(--dim); font-size:12px; margin-top:6px">Planilha: <span class="path">${esc(DATA.excel.path)}</span></p>`;
  el.innerHTML = html;
})();

/* ---- cards de inconsistência (filtro) ---- */
function renderIssueCards(){
  document.getElementById("issueCards").innerHTML = DATA.issues.map(i=>
    `<button class="card ${activeFlag===i.code?'on':''} ${i.count?'':'zero'}" style="--c:${i.color}" data-f="${i.code}">
       <div class="v">${fmt(i.count)}</div><div class="l">${esc(i.label)}</div><div class="h">${esc(i.hint)}</div>
     </button>`).join("");
  document.querySelectorAll("#issueCards button").forEach(b=>b.onclick=()=>{
    activeFlag = activeFlag===b.dataset.f ? null : b.dataset.f;
    renderIssueCards(); renderCats(true);
  });
}

/* ---- tabela por categoria ---- */
function flagChip(f){ const i=ISSUE[f]; return `<span class="flag" style="--fc:${i.color}">${esc(i.label)}</span>`; }
function valCell(xl, model, inModel, inExcel, hasParam){
  // coluna Excel | coluna Modelo lado a lado, destacando divergência
  const xlHtml = inExcel ? (xl ? `<span class="val">${esc(xl)}</span>` : `<span class="none">vazio</span>`) : `<span class="none">-</span>`;
  let mHtml;
  if(!inModel) mHtml = `<span class="none">-</span>`;
  else if(hasParam===false) mHtml = `<span class="none">sem parâmetro</span>`;
  else if(!model.length) mHtml = `<span class="none">vazio</span>`;
  else mHtml = model.map(v=>`<span class="val ${inExcel && v!==xl ? 'diffv':''}">${esc(v)}</span>`).join("");
  return [xlHtml, mHtml];
}
function matches(k, q){
  if(activeFlag && !k.flags.includes(activeFlag)) return false;
  if(!q) return true;
  const hay = [k.key, k.xlPt, k.xlEn, k.fileText, k.excelCategory, k.excelGroup,
    ...k.modelPt, ...k.modelEn, ...k.holders.map(h=>h.family+" "+h.name+" "+h.category)].join(" ").toLowerCase();
  return hay.includes(q);
}
function renderCats(keepOpen){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const wrap = document.getElementById("cats");
  const openNow = new Set([...wrap.querySelectorAll("details[open]")].map(d=>d.dataset.cat));
  const groups = {};
  DATA.keynotes.forEach(k=>{ if(matches(k,q)) k.categories.forEach(c=>(groups[c]=groups[c]||[]).push(k)); });
  const names = Object.keys(groups).sort((a,b)=>{
    const ea=a.startsWith("Excel ·"), eb=b.startsWith("Excel ·");
    return ea!==eb ? (ea?1:-1) : a.localeCompare(b,"pt-BR");
  });
  const total = new Set(Object.values(groups).flat().map(k=>k.key)).size;
  document.getElementById("finfo").textContent =
    (activeFlag ? "Filtro: "+ISSUE[activeFlag].label+" · " : "") + total + " keynote(s)";
  if(!names.length){ wrap.innerHTML = `<div class="empty">Nenhum keynote para este filtro</div>`; return; }
  wrap.innerHTML = names.map(cat=>{
    const list = groups[cat].sort((a,b)=>a.key.localeCompare(b.key,"pt-BR",{numeric:true}));
    const pend = list.filter(pending).length;
    const open = (keepOpen && openNow.has(cat)) || activeFlag || q || (!keepOpen && pend);
    const rows = list.map(k=>{
      const hs = k.holders.filter(h=>h.category===cat || cat.startsWith("Excel ·"));
      const hasIn = k.holders.length ? k.holders.some(h=>h.hasIn) : null;
      const [xp, mp] = valCell(k.xlPt, k.modelPt, k.inModel, k.inExcel, true);
      const [xe, me] = valCell(k.xlEn, k.modelEn, k.inModel, k.inExcel, hasIn);
      const where = hs.length ? hs.map(h=>
          `<span class="holder"><span class="kd">${h.kind==="material"?"mat":"tipo"}</span>${esc(h.family?h.family+" - ":"")}${esc(h.name)}
           <span class="id">#${h.id} · ${fmt(h.count)} un${h.kind==="material"&&h.usedIn.length?" · "+esc(h.usedIn.join(", ")):""}</span></span>`).join("")
        : `<span class="none">não usado no modelo</span>`;
      const xlInfo = k.inExcel ? `<span class="sub">Excel linha ${k.excelRow}${k.excelGroup?" · "+esc(k.excelGroup):""}${k.excelDupRows.length?" · repetido nas linhas "+k.excelDupRows.join(", "):""}</span>` : "";
      const fileInfo = k.fileText ? `<span class="sub">Arquivo .txt: ${esc(k.fileText)}</span>` : "";
      const flags = k.flags.length ? k.flags.map(flagChip).join("") : `<span class="ok">✓ OK</span>`;
      return `<tr><td><span class="key">${esc(k.key)}</span>${xlInfo}</td>
        <td>${flags}</td><td>${xp}</td><td>${mp}${fileInfo}</td><td>${xe}</td><td>${me}</td><td>${where}</td></tr>`;
    }).join("");
    return `<details class="cat" data-cat="${esc(cat)}" ${open?"open":""}>
      <summary><span class="cn">${esc(cat)}</span>
        <span class="cc">${list.length} keynote(s)${pend?` · <b>${pend} com pendência</b>`:""}</span></summary>
      <div class="tw"><table><thead><tr><th>Keynote</th><th>Status</th><th>Descrição · Excel</th>
        <th>Description · Modelo</th><th>Descrição IN · Excel</th><th>Descrição IN · Modelo</th>
        <th>Tipos / Materiais</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  }).join("");
}

/* ---- alterações gravadas e itens pulados ---- */
(function(){
  const el = document.getElementById("changesWrap");
  let html = "";
  if(DATA.changes.length){
    const lbl = {append:"adicionado", fill:"preenchido", overwrite:"sobrescrito"};
    html += `<h2 style="margin-top:36px">Alterações gravadas (${DATA.changes.length})</h2><div class="panel tw" style="padding:6px"><table>
      <thead><tr><th>Destino</th><th>Ação</th><th>Keynote</th><th>Onde</th><th>Campo</th><th>Antes</th><th>Depois</th></tr></thead><tbody>${
      DATA.changes.map(c=>`<tr><td>${c.target==="excel"?"Excel":"Modelo"}</td><td>${lbl[c.action]||c.action}</td>
        <td class="key">${esc(c.key)}</td><td>${esc(c.where)}${c.id?` <span class="holder id">#${c.id}</span>`:""}</td>
        <td>${esc(c.field)}</td><td>${c.old?esc(c.old):'<span class="none">vazio</span>'}</td><td>${esc(c.new)}</td></tr>`).join("")
    }</tbody></table></div>`;
  }
  if(DATA.skipped.length){
    html += `<h2 style="margin-top:36px">Não gravados (${DATA.skipped.length})</h2><div class="panel tw" style="padding:6px"><table>
      <thead><tr><th>Keynote</th><th>Tipo / Material</th><th>ID</th><th>Motivo</th></tr></thead><tbody>${
      DATA.skipped.map(s=>`<tr><td class="key">${esc(s.key)}</td><td>${esc(s.where)}</td>
        <td class="mono">${s.id||"-"}</td><td style="color:var(--amber)">${esc(s.reason)}</td></tr>`).join("")
    }</tbody></table></div>`;
  }
  el.innerHTML = html;
})();

/* ---- CSV ---- */
function exportCsv(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const cell = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
  const head = ["Keynote","Categorias","Status","Descrição Excel","Description Modelo",
    "Descrição IN Excel","Descrição IN Modelo","Linha Excel","Tipos/Materiais"];
  const lines = [head.map(cell).join(";")];
  DATA.keynotes.filter(k=>matches(k,q)).forEach(k=>lines.push([
    k.key, k.categories.join(" | "), k.flags.map(f=>ISSUE[f].label).join(" | ") || "OK",
    k.xlPt, k.modelPt.join(" | "), k.xlEn, k.modelEn.join(" | "), k.excelRow||"",
    k.holders.map(h=>(h.family?h.family+" - ":"")+h.name+" #"+h.id).join(" | ")
  ].map(cell).join(";")));
  const blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "keynotes_" + DATA.project.replace(/\.rvt$/i,"").replace(/[^\w-]+/g,"_") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

document.getElementById("q").addEventListener("input", ()=>renderCats(true));
document.getElementById("expand").onclick = ()=>document.querySelectorAll("details.cat").forEach(d=>d.open=true);
document.getElementById("collapse").onclick = ()=>document.querySelectorAll("details.cat").forEach(d=>d.open=false);
document.getElementById("csv").onclick = exportCsv;
renderIssueCards(); renderCats(false);
</script>
</body>
</html>
